name: Verify QEMU 11.1.3 persistent TCG adapter

on:
  push:
    branches:
      - work/persistent-translation-cache
    paths:
      - "patches/qemu/11.1.3/**"
      - "native/phoenixvm-core/**"
      - ".github/workflows/verify-qemu-tcg-cache.yml"
  pull_request:
    paths:
      - "patches/qemu/11.1.3/**"
      - "native/phoenixvm-core/**"
      - ".github/workflows/verify-qemu-tcg-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-tcg-cache-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-qemu:
    name: Build patched QEMU 11.1.3 (x86_64-softmmu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PhoenixVM
        uses: actions/checkout@v4

      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            git \
            libaio-dev \
            libattr1-dev \
            libcap-ng-dev \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            libslirp-dev \
            liburing-dev \
            libusb-1.0-0-dev \
            libzstd-dev \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            zlib1g-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build PhoenixVM native cache library
        run: cargo build --release --manifest-path native/phoenixvm-core/Cargo.toml

      - name: Download and verify the exact QEMU source archive
        env:
          QEMU_SHA256: 5a8289c7940dc77d3873c81a6c29ba3afe1446fc9d36e77fa1658cdbecb84b22
        run: |
          curl --fail --location --retry 5 \
            https://download.qemu.org/qemu-11.1.3.tar.xz \
            --output "$RUNNER_TEMP/qemu-11.1.3.tar.xz"
          echo "$QEMU_SHA256  $RUNNER_TEMP/qemu-11.1.3.tar.xz" | sha256sum --check
          mkdir "$RUNNER_TEMP/qemu-src"
          tar -xJf "$RUNNER_TEMP/qemu-11.1.3.tar.xz" \
            --strip-components=1 -C "$RUNNER_TEMP/qemu-src"

      - name: Apply PhoenixVM TCG adapter patch
        run: bash patches/qemu/11.1.3/apply.sh "$RUNNER_TEMP/qemu-src"

      - name: Configure QEMU system emulator
        working-directory: \${{ runner.temp }}/qemu-src
        run: |
          ./configure \
            --target-list=x86_64-softmmu \
            --disable-werror \
            --disable-docs \
            --disable-tools \
            --disable-guest-agent \
            --disable-gtk \
            --disable-sdl \
            --disable-vnc \
            --disable-spice \
            --disable-capstone \
            --disable-libiscsi \
            --disable-rbd \
            --disable-glusterfs \
            --disable-nfs \
            --disable-curl

      - name: Compile patched QEMU TCG core
        working-directory: \${{ runner.temp }}/qemu-src
        run: ninja -C build qemu-system-x86_64

      - name: Verify QEMU binary and linked TCG adapter
        working-directory: \${{ runner.temp }}/qemu-src
        run: |
          test -x build/qemu-system-x86_64
          build/qemu-system-x86_64 --version
          nm build/qemu-system-x86_64 | grep -E 'phoenixvm_tcg_cache_(start|try_restore|store)'
