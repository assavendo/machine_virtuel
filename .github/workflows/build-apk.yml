name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - name: Native core
        run: |
          cargo ndk -t arm64-v8a -t x86_64             -o app/src/main/jniLibs             build --manifest-path native/phoenixvm-core/Cargo.toml --release
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - run: gradle --no-daemon test
      - run: gradle --no-daemon lint
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: phoenixvm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
