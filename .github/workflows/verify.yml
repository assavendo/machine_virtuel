name: Verify native core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path native/phoenixvm-core/Cargo.toml -- --check
      - run: cargo test --manifest-path native/phoenixvm-core/Cargo.toml
      - run: cc -std=c11 -Wall -Wextra -Werror -I native/phoenixvm-core/include -fsyntax-only native/phoenixvm-core/tests/tcg_cache_ffi_header.c
