name: Quality and security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust format
        run: cargo fmt --manifest-path native/phoenixvm-core/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path native/phoenixvm-core/Cargo.toml

      - name: Build native core
        working-directory: native/phoenixvm-core
        run: cargo ndk -t arm64-v8a -t x86_64 -o ../../app/src/main/jniLibs build --release

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Shell script syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Third-party SBOM validation
        run: python3 scripts/validate-third-party-sbom.py

      - name: License tracking files
        run: |
          test -f docs/THIRD_PARTY_LICENSES.md
          test -f THIRD_PARTY/DroidVM-Prebuilts.txt
          test -f THIRD_PARTY/DroidVM-Prebuilts.json
          test -f THIRD_PARTY/DroidVM-license.yaml

      - name: Full-system policy check
        run: |
          if grep -R -nE 'Wine|Winlator|Box64|Box86|FEX' app/src/main/java/com/assavendo/machinevirtuel/runtime; then
            echo "Compatibility layer leaked into the VMM runtime."
            exit 1
          fi
